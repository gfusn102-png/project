<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>تفسیر سوره قمر</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: 'Vazirmatn', Tahoma, sans-serif; }

body {
  background: radial-gradient(ellipse at top, #1a7a7a 0%, #0d5c5c 40%, #063a3a 100%);
  color: #2d3e2a;
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* ستاره‌ها */
.stars { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
.star { position: absolute; width: 3px; height: 3px; background: #f5e6a8; border-radius: 50%; box-shadow: 0 0 8px #d4af37, 0 0 16px #d4af37; animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }

/* ذرات */
.particles { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.particle { position: absolute; width: 5px; height: 5px; background: radial-gradient(circle, #f5e6a8, #d4af37, transparent); border-radius: 50%; box-shadow: 0 0 10px #d4af37; animation: floatUp linear infinite; }
@keyframes floatUp { 0% { transform: translateY(0) scale(0); opacity: 0; } 10% { opacity: 0.9; } 90% { opacity: 0.9; } 100% { transform: translateY(-100vh) scale(1); opacity: 0; } }

/* نورها */
.glow-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: orbMove 20s ease-in-out infinite; }
.orb-1 { width: 300px; height: 300px; background: #d4af37; top: -100px; right: -100px; }
.orb-2 { width: 400px; height: 400px; background: #1a7a7a; bottom: -150px; left: -150px; animation-delay: -7s; }
.orb-3 { width: 250px; height: 250px; background: #a8c686; top: 40%; left: 30%; animation-delay: -14s; }
@keyframes orbMove { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(50px, -30px) scale(1.1); } 66% { transform: translate(-30px, 50px) scale(0.9); } }

/* نوار پیشرفت */
.progress-bar { position: fixed; top: 0; left: 0; width: 100%; height: 6px; background: rgba(255,255,255,0.05); z-index: 100; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #d4af37, #f5e6a8, #d4af37, #a8c686, #d4af37); background-size: 300% 100%; animation: shimmer 3s linear infinite; transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 0 20px #d4af37, 0 0 40px rgba(212,175,55,0.6); }
@keyframes shimmer { 0% { background-position: 0% 0; } 100% { background-position: 300% 0; } }

/* شمارنده */
.slide-counter { position: fixed; top: 26px; left: 26px; font-size: 1rem; color: #f5e6a8; z-index: 100; background: rgba(0,0,0,0.5); padding: 10px 22px; border-radius: 30px; backdrop-filter: blur(12px); border: 1px solid rgba(212,175,55,0.5); box-shadow: 0 0 25px rgba(212,175,55,0.4); font-weight: 700; letter-spacing: 1.5px; }

/* کانتینر */
#app { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; z-index: 10; perspective: 1500px; }

/* کادر */
.slide-card { max-width: 1100px; width: 100%; max-height: 82vh; overflow-y: auto; background: linear-gradient(145deg, rgba(245,239,224,0.97), rgba(237,228,208,0.93)); backdrop-filter: blur(20px); border-radius: 28px; padding: 3rem 2.5rem; position: relative; box-shadow: 0 30px 90px rgba(0,0,0,0.6), 0 0 80px rgba(212,175,55,0.25), inset 0 1px 0 rgba(255,255,255,0.9); opacity: 0; transform: translateY(60px) rotateX(-15deg) scale(0.95); transition: opacity 1s ease, transform 1s cubic-bezier(0.25, 0.46, 0.45, 0.94); border: 3px solid rgba(212,175,55,0.6); }
.slide-card.visible { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); }
.slide-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #d4af37, #f5e6a8, #d4af37); background-size: 200% 100%; animation: shimmer 2s linear infinite; border-radius: 28px 28px 0 0; box-shadow: 0 0 25px #d4af37, 0 0 50px rgba(212,175,55,0.6); }
.slide-card::after { content: ''; position: absolute; inset: -3px; border-radius: 28px; background: linear-gradient(45deg, #d4af37, transparent, #a8c686, transparent, #d4af37); background-size: 400% 400%; z-index: -1; animation: borderGlow 6s ease infinite; opacity: 0.6; }
@keyframes borderGlow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

.slide-card::-webkit-scrollbar { width: 6px; }
.slide-card::-webkit-scrollbar-thumb { background: linear-gradient(#d4af37, #a8c686); border-radius: 3px; }
.slide-card::-webkit-scrollbar-track { background: transparent; }

/* عنوان */
.slide-title { font-size: 2.2rem; color: #0d5c5c; margin-bottom: 1.6rem; line-height: 1.6; font-weight: 800; border-right: 6px solid #d4af37; padding-right: 20px; position: relative; text-shadow: 0 2px 12px rgba(212,175,55,0.4); }
.slide-title::before { content: ''; position: absolute; right: -6px; top: 0; bottom: 0; width: 6px; background: linear-gradient(180deg, #d4af37, #a8c686, #d4af37); background-size: 100% 200%; animation: shimmer 2s linear infinite; border-radius: 3px; box-shadow: 0 0 15px #d4af37; }

/* متن */
.slide-content { font-size: 1.25rem; line-height: 2.3; color: #1a2a18; text-align: justify; font-weight: 500; }

/* آیات */
.slide-quran .slide-title { color: #4a6741; }
.slide-quran .slide-content { font-size: 1.3rem; font-weight: 600; line-height: 2.5; color: #1a3a1a; }
.slide-quran .slide-content .arabic { font-family: 'Amiri Quran', 'Amiri', serif; font-size: 1.7rem; color: #0d5c5c; text-shadow: 0 0 20px rgba(212,175,55,0.5); }

/* جلد */
.slide-cover .slide-title { font-size: 3.2rem; text-align: center; border: none; padding: 0; color: #0d5c5c; text-shadow: 0 0 40px rgba(212,175,55,0.7), 0 0 80px rgba(212,175,55,0.4); animation: titleGlow 3s ease-in-out infinite; }
@keyframes titleGlow { 0%, 100% { text-shadow: 0 0 40px rgba(212,175,55,0.7), 0 0 80px rgba(212,175,55,0.4); } 50% { text-shadow: 0 0 60px rgba(212,175,55,1), 0 0 120px rgba(212,175,55,0.6); } }
.slide-cover .slide-content { text-align: center; font-size: 1.4rem; color: #2d3e2a; }

/* پایانی */
.slide-final .slide-title { font-size: 2.6rem; text-align: center; border: none; padding: 0; color: #0d5c5c; text-shadow: 0 0 40px rgba(212,175,55,0.8); }
.slide-final .slide-content { text-align: center; font-size: 1.4rem; }

/* دکمه‌ها - بزرگ‌تر برای تاچ */
.nav-buttons { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 24px; z-index: 100; }

.nav-btn {
  position: relative;
  padding: 18px 60px;
  font-size: 1.3rem;
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  font-weight: 800;
  color: #f5e6a8;
  background: rgba(13, 92, 92, 0.7);
  border: none;
  border-radius: 60px;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden;
  backdrop-filter: blur(15px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 35px rgba(212,175,55,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  letter-spacing: 1.5px;
  min-width: 180px;
  touch-action: manipulation;
}

.nav-btn::before { content: ''; position: absolute; inset: -3px; border-radius: 60px; padding: 3px; background: linear-gradient(90deg, #d4af37, #f5e6a8, #a8c686, #d4af37); background-size: 300% 100%; -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: shimmer 3s linear infinite; pointer-events: none; }
.nav-btn::after { content: ''; position: absolute; top: 50%; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(245,230,168,0.7), transparent); transform: translateY(-50%); animation: btnShine 3s linear infinite; }
@keyframes btnShine { 0% { left: -100%; } 100% { left: 200%; } }

.nav-btn:hover { transform: translateY(-5px) scale(1.05); background: rgba(212, 175, 55, 0.95); color: #0d5c5c; box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 50px rgba(212,175,55,0.9), inset 0 1px 0 rgba(255,255,255,0.5); }
.nav-btn:active { transform: translateY(-2px) scale(1.02); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

/* موج */
.ripple { position: fixed; border-radius: 50%; background: radial-gradient(circle, rgba(212,175,55,0.6), rgba(168,198,134,0.4), transparent); transform: scale(0); animation: rippleAnim 1s ease-out forwards; pointer-events: none; z-index: 999; box-shadow: 0 0 40px rgba(212,175,55,0.7); }
@keyframes rippleAnim { to { transform: scale(5); opacity: 0; } }

/* خط */
.draw-line { position: fixed; height: 4px; background: linear-gradient(90deg, #d4af37, #f5e6a8, #d4af37); pointer-events: none; z-index: 998; transition: opacity 0.8s ease; border-radius: 4px; box-shadow: 0 0 20px #d4af37, 0 0 40px rgba(212,175,55,0.7); }

/* ============ رزولوشن‌های پروژکتور ============ */

/* 1024x768 */
@media (max-width: 1100px) {
  .slide-title { font-size: 1.8rem; }
  .slide-content { font-size: 1.1rem; }
  .slide-quran .slide-content { font-size: 1.15rem; }
  .slide-cover .slide-title { font-size: 2.6rem; }
  .nav-btn { padding: 15px 45px; font-size: 1.1rem; min-width: 150px; }
}

/* 800x600 یا کوچک‌تر */
@media (max-width: 900px) {
  .slide-title { font-size: 1.5rem; }
  .slide-content { font-size: 0.98rem; line-height: 2.1; }
  .slide-quran .slide-content { font-size: 1rem; }
  .slide-quran .slide-content .arabic { font-size: 1.4rem; }
  .slide-cover .slide-title { font-size: 2rem; }
  .slide-final .slide-title { font-size: 1.8rem; }
  .nav-btn { padding: 12px 32px; font-size: 1rem; min-width: 120px; }
  .slide-card { padding: 2rem 1.5rem; }
  .slide-counter { font-size: 0.85rem; padding: 8px 16px; }
}

/* موبایل */
@media (max-width: 600px) {
  .slide-title { font-size: 1.3rem; }
  .slide-content { font-size: 0.9rem; }
  .slide-cover .slide-title { font-size: 1.7rem; }
  .nav-btn { padding: 10px 24px; font-size: 0.88rem; min-width: 100px; }
  .slide-card { padding: 1.6rem 1.1rem; }
}

/* ارتفاع کم */
@media (max-height: 700px) {
  .slide-card { padding: 1.8rem 1.5rem; max-height: 80vh; }
  .slide-title { margin-bottom: 1rem; }
}
</style>
</head>
<body>

<div class="glow-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="stars" id="stars"></div>
<div class="particles" id="particles"></div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="slide-counter"><span id="currentSlide">۱</span> / <span id="totalSlides">۰</span></div>

<div id="app"></div>

<div class="nav-buttons">
  <button id="prevBtn" class="nav-btn">قبلی</button>
  <button id="nextBtn" class="nav-btn">بعدی</button>
</div>

<script src="script.js"></script>
</body>
</html>
